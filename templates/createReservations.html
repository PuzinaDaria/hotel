<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новое бронирование | Hotel Transylvania</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .form-container { max-width: 800px; margin: 30px auto; padding: 0 30px; }
        .form-card {
            background: linear-gradient(135deg, rgba(12,5,7,0.95), rgba(8,3,5,0.98));
            border-radius: 12px 36px 12px 36px; padding: 35px; margin-bottom: 30px;
            border: 1px solid rgba(139,0,0,0.4);
        }
        .form-card h2 { font-family: 'UnifrakturMaguntia', cursive; font-size: 1.5rem; color: #cc7777; margin-bottom: 25px; border-left: 3px solid #8b0000; padding-left: 20px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #cc8888; font-size: 0.85rem; }
        input, select {
            width: 100%; padding: 12px 16px; background: #0a0305; border: 1px solid #5a1515;
            border-radius: 6px 16px 6px 16px; color: #d4a0a0; font-family: 'Cinzel', serif;
            text-transform: none !important;
        }
        input:focus, select:focus { outline: none; border-color: #cc3333; box-shadow: 0 0 12px rgba(200,30,40,0.3); }
        .date-section { background: rgba(139,0,0,0.1); border-radius: 12px; padding: 20px; margin-top: 15px; }
        button[type="submit"] {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #2a0808, #4a1010);
            color: #cc8888; border: 1px solid #8b0000; border-radius: 6px 18px 6px 18px;
            font-family: 'Cinzel', serif; font-size: 1.1rem; cursor: pointer; transition: 0.3s;
        }
        button[type="submit"]:hover { background: #5a1515; color: #ffaaaa; box-shadow: 0 0 20px rgba(180,20,30,0.4); }
        .back-link { display: inline-block; margin-bottom: 20px; color: #aa5555; text-decoration: none; }
        .back-link:hover { color: #cc7777; }
        h1 { font-family: 'UnifrakturMaguntia', cursive; font-size: 2rem; color: #cc7777; margin-bottom: 20px; }

        .service-checkbox {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 6px 14px 6px 14px;
            border: 1px solid #3a1515;
            cursor: pointer;
            transition: 0.2s;
        }
        .service-checkbox:hover {
            border-color: #cc3333;
            background: rgba(20,5,8,0.5);
        }
        .service-checkbox input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #cc3333;
            cursor: pointer;
        }
        .service-checkbox label {
            cursor: pointer;
            flex: 1;
            margin-bottom: 0;
        }
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="header"><div class="logo" onclick="window.location.href='/'"><span>Hotel Transylvania</span></div>
        <div class="user-profile"><span class="username">Администратор</span><div class="avatar" onclick="window.location.href='profile.html'">👤</div></div>
    </header>
    <main>
        <div class="form-container">
            <a href="/" class="back-link">← На главную</a>
            <h1>➕ Новое бронирование</h1>
            
            <form id="reservationForm">
                <div class="form-card">
                    <h2>👤 Данные клиента</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Имя *</label>
                            <input type="text" id="clientName" placeholder="Иван" required>
                        </div>
                        <div class="form-group">
                            <label>Фамилия *</label>
                            <input type="text" id="clientLastname" placeholder="Иванов" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>📞 Телефон *</label>
                        <input type="text" id="clientPhone" placeholder="+7 999 123-45-67" required>
                    </div>
                </div>

                <div class="form-card">
                    <h2>📋 Данные бронирования</h2>
                    <div class="form-group">
                        <label>Администратор *</label>
                        <select id="adminSelect" required>
                            <option value="">Выберите администратора...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Номер *</label>
                        <select id="roomSelect" required>
                            <option value="">Выберите номер...</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Дополнительные услуги (можно выбрать несколько)</label>
                        <div id="servicesContainer"></div>
                    </div>
                    
                    <div class="date-section">
                        <div class="form-row">
                            <div class="form-group">
                                <label>📅 Дата заезда *</label>
                                <input type="date" id="checkIn" required>
                            </div>
                            <div class="form-group">
                                <label>📅 Дата выезда *</label>
                                <input type="date" id="checkOut" required>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit">✨ Создать бронирование</button>
            </form>
        </div>
    </main>

    <script>
        async function loadSelectData() {
            try {
                const adminsRes = await fetch('/reservation/admins/list');
                const admins = await adminsRes.json();
                const adminSelect = document.getElementById('adminSelect');
                admins.forEach(a => {
                    const option = document.createElement('option');
                    option.value = a.a_id;
                    option.textContent = `${a.a_name} ${a.a_lastname} (${a.a_login})`;
                    adminSelect.appendChild(option);
                });

                const roomsRes = await fetch('/reservation/rooms/list');
                const rooms = await roomsRes.json();
                const roomSelect = document.getElementById('roomSelect');
                rooms.forEach(r => {
                    const option = document.createElement('option');
                    option.value = r.n_id;
                    option.textContent = `№${r.n_count} - ${r.n_type} (${r.n_cost}₽/сут)`;
                    roomSelect.appendChild(option);
                });

                const servicesRes = await fetch('/reservation/services/list');
                const services = await servicesRes.json();
                const servicesContainer = document.getElementById('servicesContainer');
                services.forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'service-checkbox';
                    div.innerHTML = `
                        <input type="checkbox" id="service_${s.as_id}" value="${s.as_id}">
                        <label for="service_${s.as_id}">${s.as_name} (${s.as_cost}₽)</label>
                    `;
                    servicesContainer.appendChild(div);
                });

            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                alert('❌ Ошибка загрузки данных для формы');
            }
        }

        document.getElementById('reservationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const clientName = document.getElementById('clientName').value.trim();
            const clientLastname = document.getElementById('clientLastname').value.trim();
            const clientPhone = document.getElementById('clientPhone').value.trim();
            const adminId = parseInt(document.getElementById('adminSelect').value);
            const roomId = parseInt(document.getElementById('roomSelect').value);
            
            const selectedServices = [];
            document.querySelectorAll('#servicesContainer input[type="checkbox"]:checked').forEach(cb => {
                selectedServices.push(parseInt(cb.value));
            });
            
            const checkIn = document.getElementById('checkIn').value;
            const checkOut = document.getElementById('checkOut').value;
            
            if (!clientName || !clientLastname || !clientPhone || !adminId || !roomId || !checkIn || !checkOut) {
                alert('❌ Заполните все обязательные поля');
                return;
            }
            
            if (checkIn >= checkOut) {
                alert('❌ Дата заезда должна быть раньше даты выезда');
                return;
            }
            
            try {
                const response = await fetch('/reservation/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        a_id: adminId,
                        n_id: roomId,
                        service_ids: selectedServices,
                        r_datearrival: checkIn,
                        r_datedeparture: checkOut,
                        r_st: 'активно',
                        c_name: clientName,
                        c_lastname: clientLastname,
                        c_tel: clientPhone
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Ошибка создания бронирования');
                }
                
                alert('✅ Бронирование успешно создано!');
                this.reset();
                // Сбрасываем чекбоксы
                document.querySelectorAll('#servicesContainer input[type="checkbox"]').forEach(cb => cb.checked = false);
            } catch (error) {
                console.error('Ошибка:', error);
                alert('❌ ' + error.message);
            }
        });

        document.addEventListener('DOMContentLoaded', loadSelectData);
    </script>
</body>
</html>
