<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новое бронирование | Hotel</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .form-container { max-width: 800px; margin: 30px auto; padding: 0 30px; }
        .form-card {
            background: linear-gradient(135deg, rgba(12,5,7,0.95), rgba(8,3,5,0.98));
            border-radius: 12px 36px 12px 36px; padding: 35px; margin-bottom: 30px;
            border: 1px solid rgba(139,0,0,0.4);
        }
        .form-card h2 { font-family: 'UnifrakturMaguntia', cursive; font-size: 1.5rem; color: #cc7777; margin-bottom: 25px; border-left: 3px solid #8b0000; padding-left: 20px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #cc8888; font-size: 0.85rem; }
        input, select, textarea {
            width: 100%; padding: 12px 16px; background: #0a0305; border: 1px solid #5a1515;
            border-radius: 6px 16px 6px 16px; color: #d4a0a0; font-family: 'Cinzel', serif;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #cc3333; box-shadow: 0 0 12px rgba(200,30,40,0.3); }
        .date-section { background: rgba(139,0,0,0.1); border-radius: 12px; padding: 20px; margin-top: 15px; }
        .rooms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin: 20px 0; }
        .room-option {
            background: #0a0305; border: 1px solid #3a1515; border-radius: 8px 20px 8px 20px;
            padding: 15px; cursor: pointer; text-align: center; transition: 0.2s;
        }
        .room-option:hover { border-color: #cc3333; background: #150808; }
        .room-option.selected { border-color: #cc3333; background: #2a0808; box-shadow: 0 0 15px rgba(200,30,40,0.3); }
        .room-number { font-size: 1.3rem; font-family: 'UnifrakturMaguntia', cursive; color: #cc8888; }
        .services-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin: 20px 0; }
        .service-checkbox { background: #0a0305; border: 1px solid #3a1515; border-radius: 6px 14px 6px 14px; padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .service-checkbox input { width: auto; margin: 0; }
        .total-price { background: #1a0a0a; border-radius: 8px 20px 8px 20px; padding: 20px; text-align: right; margin-top: 25px; border: 1px solid #8b0000; }
        .total-price .price { font-size: 1.8rem; color: #ff7777; font-family: 'UnifrakturMaguntia', cursive; }
        button[type="submit"] {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #2a0808, #4a1010);
            color: #cc8888; border: 1px solid #8b0000; border-radius: 6px 18px 6px 18px;
            font-family: 'Cinzel', serif; font-size: 1.1rem; cursor: pointer; transition: 0.3s;
        }
        button[type="submit"]:hover { background: #5a1515; color: #ffaaaa; box-shadow: 0 0 20px rgba(180,20,30,0.4); }
        .back-link { display: inline-block; margin-bottom: 20px; color: #aa5555; text-decoration: none; }
        .back-link:hover { color: #cc7777; }
        h1 { font-family: 'UnifrakturMaguntia', cursive; font-size: 2rem; color: #cc7777; margin-bottom: 20px; }
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="header"><div class="logo" onclick="window.location.href='/'"><span>Hotel</span></div>
        <div class="user-profile"><span class="username">Администратор</span><div class="avatar" onclick="window.location.href='profile.html'">👤</div></div>
    </header>
    <main><div class="form-container"><a href="/" class="back-link">← На главную</a><h1>➕ Новое бронирование</h1>
    <form id="reservationForm">
        <div class="form-card"><h2>👤 Данные гостя</h2>
            <div class="form-row">
                <div class="form-group"><label>Имя *</label><input type="text" id="firstName" required></div>
                <div class="form-group"><label>Фамилия *</label><input type="text" id="lastName" required></div>
            </div>
            <div class="form-group"><label>📞 Телефон *</label><input type="tel" id="phone" required></div>
            
            <div class="date-section">
                <div class="form-row">
                    <div class="form-group"><label>📅 Дата заезда *</label><input type="date" id="checkIn" required></div>
                    <div class="form-group"><label>📅 Дата выезда *</label><input type="date" id="checkOut" required></div>
                </div>
            </div>
        </div>

        <div class="form-card"><h2>🛏️ Выбор номера</h2>
            <div class="rooms-grid" id="roomsGrid"></div>
            <input type="hidden" id="selectedRoomId"><input type="hidden" id="selectedRoomPrice">
        </div>

        <div class="form-card"><h2>🍽️ Дополнительные услуги</h2>
            <div class="services-list" id="servicesList"></div>
            <div class="total-price"><span>💰 Итого:</span> <span class="price" id="totalPrice">0 ₽</span></div>
        </div>

        <button type="submit">✨ Создать бронирование</button>
    </form></div></main>
    <footer class="footer"><p>Hotel Management System © 2026</p></footer>

    <script>
        let rooms = JSON.parse(localStorage.getItem('hotel_rooms') || '[{"id":1,"number":"101","type":"Стандарт","price":3500},{"id":2,"number":"102","type":"Стандарт+","price":4200},{"id":3,"number":"201","type":"Люкс","price":6800},{"id":4,"number":"202","type":"Полулюкс","price":5200},{"id":5,"number":"301","type":"Президентский","price":12000}]');
        let services = JSON.parse(localStorage.getItem('hotel_services') || '[{"id":1,"name":"Завтрак","price":800},{"id":2,"name":"Обед в номер","price":1200},{"id":3,"name":"Спа","price":2500},{"id":4,"name":"Трансфер","price":1800}]');
        let selectedRoom = null;
        let selectedServices = [];

        function renderRooms() {
            document.getElementById('roomsGrid').innerHTML = rooms.map(r => `<div class="room-option" data-id="${r.id}" data-price="${r.price}"><div class="room-number">№${r.number}</div><div>${r.type}</div><div>${r.price} ₽/ночь</div></div>`).join('');
            document.querySelectorAll('.room-option').forEach(el => el.addEventListener('click', function() {
                document.querySelectorAll('.room-option').forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
                selectedRoom = { id: parseInt(this.dataset.id), price: parseInt(this.dataset.price) };
                document.getElementById('selectedRoomId').value = selectedRoom.id;
                updateTotal();
            }));
        }
        function renderServices() {
            document.getElementById('servicesList').innerHTML = services.map(s => `<label class="service-checkbox"><input type="checkbox" data-id="${s.id}" data-price="${s.price}"><span>${s.name}</span><span style="color:#aa5555;">${s.price} ₽</span></label>`).join('');
            document.querySelectorAll('.service-checkbox input').forEach(cb => cb.addEventListener('change', function() {
                const id = parseInt(this.dataset.id), price = parseInt(this.dataset.price);
                if(this.checked) selectedServices.push({ id, price });
                else selectedServices = selectedServices.filter(s => s.id !== id);
                updateTotal();
            }));
        }
        function updateTotal() {
            const checkIn = document.getElementById('checkIn').value, checkOut = document.getElementById('checkOut').value;
            let nights = 0;
            if(checkIn && checkOut) { const diff = new Date(checkOut) - new Date(checkIn); if(diff > 0) nights = Math.ceil(diff / (1000*60*60*24)); }
            let roomTotal = selectedRoom ? selectedRoom.price * nights : 0;
            let servicesTotal = selectedServices.reduce((s, i) => s + i.price, 0);
            document.getElementById('totalPrice').innerHTML = (roomTotal + servicesTotal).toLocaleString() + ' ₽';
        }
        document.getElementById('checkIn').addEventListener('change', updateTotal);
        document.getElementById('checkOut').addEventListener('change', updateTotal);
        document.getElementById('reservationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const phone = document.getElementById('phone').value;
            if(!firstName || !lastName || !phone) { alert('❌ Заполните все поля'); return; }
            if(!selectedRoom) { alert('❌ Выберите номер'); return; }
            alert(`✅ Бронирование для ${firstName} ${lastName} создано!`);
            this.reset();
            selectedRoom = null;
            selectedServices = [];
            document.querySelectorAll('.room-option').forEach(opt => opt.classList.remove('selected'));
            document.querySelectorAll('.service-checkbox input').forEach(cb => cb.checked = false);
            updateTotal();
        });
        renderRooms(); renderServices();
    </script>
</body>
</html>
