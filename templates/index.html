<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel | Панель управления</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="header">
        <div class="logo" onclick="window.location.href='/'"><span>Hotel Transylvania</span></div>
        <div class="user-profile">
            <span class="username">Администратор</span>
            <div class="avatar" onclick="window.location.href='profile.html'">👤</div>
        </div>
    </header>

    <main class="grid-container">
        <div class="card card-large" onclick="window.location.href='allReservations.html'">
            <div class="card-content">
                <div class="icon">📋</div>
                <h2>Все бронирования</h2>
                <p>Просмотр, редактирование и управление всеми бронированиями</p>
            </div>
        </div>

        <div class="card card-large" onclick="window.location.href='createReservations.html'">
            <div class="card-content">
                <div class="icon">➕</div>
                <h2>Новое бронирование</h2>
                <p>Добавление нового бронирования для клиента</p>
            </div>
        </div>

        <div class="card card-half" onclick="window.location.href='room.html'">
            <div class="card-content">
                <div class="icon">🛏️</div>
                <h2>Все номера</h2>
                <p>Управление номерами и их статусом</p>
            </div>
        </div>

        <div class="card card-half" onclick="window.location.href='additionalServices.html'">
            <div class="card-content">
                <div class="icon">🍽️</div>
                <h2>Дополнительные услуги</h2>
                <p>Список услуг и их стоимость</p>
            </div>
        </div>
    </main>

</body>
</html>
