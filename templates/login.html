<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Hotel</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 80px auto;
            background: linear-gradient(135deg, rgba(12,5,7,0.95), rgba(8,3,5,0.98));
            border-radius: 12px 36px 12px 36px;
            padding: 45px;
            border: 1px solid rgba(139,0,0,0.5);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: relative;
        }
        .auth-container::before { content: '⚔️'; position: absolute; top: 15px; left: 20px; opacity: 0.4; color: #8b0000; }
        .auth-container::after { content: '⚔️'; position: absolute; bottom: 15px; right: 20px; opacity: 0.4; color: #8b0000; }
        .auth-header { text-align: center; margin-bottom: 35px; }
        .auth-header h1 { font-family: 'UnifrakturMaguntia', cursive; font-size: 2rem; color: #cc7777; }
        .tabs { display: flex; margin-bottom: 35px; border-bottom: 1px solid rgba(139,0,0,0.3); }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; color: #8a6a6a; transition: 0.3s; }
        .tab:hover { color: #cc8888; }
        .tab.active { color: #cc5555; border-bottom: 2px solid #cc3333; }
        .form-group { margin-bottom: 22px; }
        label { display: block; margin-bottom: 8px; color: #cc8888; font-size: 0.85rem; }
        input {
            width: 100%; padding: 14px 18px; background: #0a0305; border: 1px solid #5a1515;
            border-radius: 6px 16px 6px 16px; color: #d4a0a0; font-family: 'Cinzel', serif;
        }
        input:focus { outline: none; border-color: #cc3333; box-shadow: 0 0 14px rgba(200,30,40,0.4); }
        .btn-auth {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #2a0808, #4a1010);
            color: #cc8888; border: 1px solid #8b0000; border-radius: 6px 18px 6px 18px;
            font-family: 'Cinzel', serif; cursor: pointer; transition: 0.3s;
        }
        .btn-auth:hover { background: #5a1515; color: #ffaaaa; box-shadow: 0 0 20px rgba(180,20,30,0.4); }
        .auth-footer { text-align: center; margin-top: 25px; color: #6a4a4a; }
        .auth-footer a { color: #cc7777; text-decoration: none; }
        .error-msg { background: rgba(180,20,30,0.2); border: 1px solid #8b0000; border-radius: 8px; padding: 10px; margin-bottom: 20px; color: #ff8888; text-align: center; }
        .success-msg { background: rgba(0,184,148,0.15); border: 1px solid #00b894; border-radius: 8px; padding: 10px; margin-bottom: 20px; color: #55efc4; text-align: center; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header"><h1>🏨 Hotel</h1><p>Войдите в систему управления</p></div>
        <div class="tabs"><div class="tab active" onclick="showForm('login')">Вход</div><div class="tab" onclick="showForm('register')">Регистрация</div></div>

        <div id="loginForm">
            <div id="loginError" class="error-msg" style="display:none;"></div>
            <div class="form-group"><label>📧 Email</label><input type="email" id="loginEmail" placeholder="admin@hotel.ru"></div>
            <div class="form-group"><label>🔒 Пароль</label><input type="password" id="loginPassword" placeholder="••••••••"></div>
            <button class="btn-auth" onclick="handleLogin()">Войти</button>
        </div>

        <div id="registerForm" style="display:none;">
            <div id="registerError" class="error-msg" style="display:none;"></div>
            <div id="registerSuccess" class="success-msg" style="display:none;"></div>
            <div class="form-group"><label>👤 Имя</label><input type="text" id="regName" placeholder="Иван"></div>
            <div class="form-group"><label>📧 Email</label><input type="email" id="regEmail" placeholder="ivan@example.com"></div>
            <div class="form-group"><label>🔒 Пароль</label><input type="password" id="regPassword" placeholder="минимум 6 символов"></div>
            <div class="form-group"><label>🔒 Подтверждение</label><input type="password" id="regConfirm" placeholder="повторите пароль"></div>
            <button class="btn-auth" onclick="handleRegister()">Зарегистрироваться</button>
        </div>

        <div class="auth-footer"><a href="#" onclick="showForm('login')">Забыли пароль?</a></div>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('hotel_users') || '[]');
        if(users.length === 0) users = [{ email: "admin@hotel.ru", password: "admin123", name: "Администратор" }];

        function showForm(type) {
            document.getElementById('loginForm').style.display = type === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = type === 'register' ? 'block' : 'none';
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (type === 'login' && i === 0) || (type === 'register' && i === 1)));
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            if(!email || !password) { errorDiv.textContent = '❌ Заполните все поля'; errorDiv.style.display = 'block'; return; }
            const user = users.find(u => u.email === email && u.password === password);
            if(user) { localStorage.setItem('hotel_user', JSON.stringify(user)); window.location.href = '/'; }
            else { errorDiv.textContent = '❌ Неверный email или пароль'; errorDiv.style.display = 'block'; }
        }

        function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const errorDiv = document.getElementById('registerError');
            const successDiv = document.getElementById('registerSuccess');
            if(!name || !email || !password) { errorDiv.textContent = '❌ Заполните все поля'; errorDiv.style.display = 'block'; return; }
            if(password.length < 6) { errorDiv.textContent = '❌ Пароль должен быть минимум 6 символов'; errorDiv.style.display = 'block'; return; }
            if(password !== confirm) { errorDiv.textContent = '❌ Пароли не совпадают'; errorDiv.style.display = 'block'; return; }
            if(users.find(u => u.email === email)) { errorDiv.textContent = '❌ Пользователь уже существует'; errorDiv.style.display = 'block'; return; }
            users.push({ name, email, password });
            localStorage.setItem('hotel_users', JSON.stringify(users));
            successDiv.textContent = '✅ Регистрация успешна! Теперь войдите.';
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            setTimeout(() => showForm('login'), 2000);
        }
    </script>
</body>
</html>
